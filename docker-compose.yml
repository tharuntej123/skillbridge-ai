version: '3.8'

services:
  backend:
    build: ./backend
    container_name: skillbridge_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skillbridge.db
      - SECRET_KEY=SUPER_SECRET_SKILLBRIDGE_KEY_1234567890!
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    restart: always

  frontend:
    build: ./frontend
    container_name: skillbridge_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
